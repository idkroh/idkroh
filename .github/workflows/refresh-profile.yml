name: Refresh profile graphics

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate graphics from public GitHub data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit updated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg assets/activity.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile activity graphics"
            git push
          fi
