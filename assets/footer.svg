<style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.2s steps(1) infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 9s linear infinite}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.45}}@keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.45}90%{opacity:.45}100%{transform:translateX(795px);opacity:0}}@media(prefers-reduced-motion:reduce){.blink,.pulse{animation:none}.scan{animation:none;opacity:0}}</style>
