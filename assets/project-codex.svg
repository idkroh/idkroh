<style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.8s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.scan{animation:scan 9s linear infinite}.portrait{animation:reveal 12s cubic-bezier(.22,.61,.36,1) infinite;will-change:clip-path,opacity}.portrait-scan{animation:portraitscan 12s cubic-bezier(.22,.61,.36,1) infinite;will-change:transform,opacity}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.45}}@keyframes scan{0%{transform:translateX(0);opacity:0}10%{opacity:.45}90%{opacity:.45}100%{transform:translateX(795px);opacity:0}}@keyframes reveal{0%{clip-path:inset(0 0 100% 0);opacity:0}4%{clip-path:inset(0 0 100% 0);opacity:1}32%,94%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}@keyframes portraitscan{0%{transform:translateY(0);opacity:0}4%{transform:translateY(0);opacity:.6}32%{transform:translateY(329px);opacity:.6}33%,100%{transform:translateY(329px);opacity:0}}@media(prefers-reduced-motion:reduce){.blink,.pulse,.portrait{animation:none}.scan,.portrait-scan{animation:none;opacity:0}}</style>
